# Alembic configuration.
#
# Note what is NOT here: sqlalchemy.url. The database address lives in
# .env and is read in alembic/env.py, so there is exactly one place it is
# defined. Two copies of a connection string eventually disagree.

[alembic]
script_location = alembic

# Puts the project root on the import path when alembic runs, so that
# `from app...` works inside env.py.
prepend_sys_path = .

# Migration filenames get a date prefix, so `ls` shows them in the order
# they were created rather than by random revision id.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
