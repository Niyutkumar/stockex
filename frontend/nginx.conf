server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: the router owns the URLs, so any path that is not
    # a real file must return index.html rather than a 404. Without this,
    # refreshing on /transactions breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the browser never sees a cross-origin request
    # and CORS does not apply in production either.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
